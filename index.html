<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoloLegacy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 700px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline { font-size: 1.3rem; opacity: 0.9; margin-bottom: 30px; }
    p { font-size: 1.1rem; margin-bottom: 40px; opacity: 0.85; }
    .btn {
      display: inline-block;
      background: linear-gradient(to right, #00d2ff, #3a7bd5);
      color: white;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(0, 210, 255, 0.4);
    }
    footer { margin-top: 50px; font-size: 0.9rem; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HoloLegacy</h1>
    <div class="tagline">Building the future, one legacy at a time</div>
    <p>
      Welcome to HoloLegacy.<br>
      We’re creating something special.<br>
      Join us and be part of the journey.
    </p>
<a href="YOUR_REAL_GOOGLE_FORM_LINK_HERE" class="btn" target="_blank">

      Get Started / Join Now
    </a>
  </div>
  <footer>© 2026 HoloLegacyproject.online</footer>
</body>
</html>
